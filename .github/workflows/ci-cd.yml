name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # 4️⃣ Install backend dependencies
      - name: Install backend dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 5️⃣ Build frontend (IMPORTANT FIX)
      - name: Build frontend
        run: |
          cd ui
          npm install
          CI=false npm run build

      # 6️⃣ Deploy to AWS EC2 via SSH
      - name: Debug Secrets
        run: |
          echo "Debug Info:"
          echo "Host configured as: ${{ secrets.EC2_HOST }}"
          echo "User configured as: ${{ secrets.EC2_USER }}"
          echo "Key length: ${#SSH_KEY}"
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          debug: true
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m # Increased timeout for builds
          script: |
            PROJECT_DIR="/home/ec2-user/inpersonSales-ReviewSys-AWS"
            
            echo "Deploying to $PROJECT_DIR"
            
            # 1. Clone or Pull Repository
            if [ -d "$PROJECT_DIR" ]; then
              echo "Directory exists. Pulling latest changes..."
              cd $PROJECT_DIR
              git pull origin main
            else
              echo "Directory does not exist. Cloning repository..."
              git clone https://github.com/PUGALARASANL2004/inpersonSales-ReviewSys-AWS.git $PROJECT_DIR
              cd $PROJECT_DIR
            fi
            
            # 2. Setup Backend (Python)
            echo "Installing backend dependencies..."
            # Ensure python3 is available, creates .venv if missing
            python3 -m venv .venv
            source .venv/bin/activate
            # Upgrade pip and install requirements
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # 3. Setup Frontend (React)
            echo "Building frontend..."
            cd ui
            # Install dependencies and build
            npm install
            CI=false npm run build
            cd ..
            
            # 4. Start/Restart Application with PM2
            echo "Restarting application via ecosystem.config.js..."
            # Start or restart using the ecosystem file
            # 'pm2 start' with ecosystem file is usually idempotent (restarts if exists)
            pm2 start ecosystem.config.js && pm2 save
            
            echo "Deployment complete!"
