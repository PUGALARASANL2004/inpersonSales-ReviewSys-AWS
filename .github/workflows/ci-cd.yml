name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # ---------- BUILD FRONTEND ----------
      - name: Build frontend
        run: |
          cd ui
          npm install
          npm run build

      # ---------- DEPLOY TO AWS ----------
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            cd /home/ec2-user/inpersonSales-ReviewSys-AWS

            git pull origin main

            source venv/bin/activate

            pip install -r requirements.txt

            pm2 restart backend || \
            pm2 start venv/bin/uvicorn \
              --name backend \
              -- api.main:app \
              --host 0.0.0.0 \
              --port 8000

            pm2 save
